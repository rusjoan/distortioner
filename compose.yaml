services:
  distortioner:
    image: ghcr.io/graynk/distortioner:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DISTORTIONER_TEMP_DIR: /tmp/distortioner
    volumes:
      - data:/app/data
      # Files downloaded by the local Bot API server (profile local-api) are
      # read straight from its volume, at the same path the server reports.
      - bot-api:/var/lib/telegram-bot-api:ro
    # Video frames are written and read many times: keep them in memory.
    tmpfs:
      - /tmp/distortioner:size=2g,mode=1777
    ports:
      - "127.0.0.1:8080:8080" # metrics and health checks; expose only if needed
    stop_grace_period: 45s # a bit longer than DISTORTIONER_SHUTDOWN_GRACE
    depends_on:
      telegram-bot-api:
        condition: service_started
        required: false

  # Self-hosted Bot API server: files up to 2 GB instead of 20 MB.
  # Enable with: docker compose --profile local-api up -d
  # and set DISTORTIONER_API_URL=http://telegram-bot-api:8081 in .env.
  telegram-bot-api:
    profiles: [local-api]
    image: aiogram/telegram-bot-api:10.3
    restart: unless-stopped
    env_file: .env # TELEGRAM_API_ID, TELEGRAM_API_HASH
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api:/var/lib/telegram-bot-api
    # 1. The server keeps files private to its user (mode 750/600), so it
    #    runs with the bot's uid (10001) to let the bot read them.
    # 2. It never deletes downloaded files: media older than an hour is removed
    #    every 10 minutes; the per-bot database (top level of each bot
    #    directory) is left alone.
    entrypoint:
      - sh
      - -c
      - |
        sed -i 's/^telegram-bot-api:x:[0-9]*:[0-9]*:/telegram-bot-api:x:10001:10001:/' /etc/passwd
        sed -i 's/^telegram-bot-api:x:[0-9]*:/telegram-bot-api:x:10001:/' /etc/group
        mkdir -p /tmp/telegram-bot-api
        chown -R telegram-bot-api:telegram-bot-api /var/lib/telegram-bot-api /tmp/telegram-bot-api
        (while true; do
          sleep 600
          find /var/lib/telegram-bot-api -mindepth 3 -type f -mmin +60 \
            -regex '.*/\(animations\|documents\|music\|photos\|stickers\|temp\|thumbnails\|video_notes\|videos\|voice\)/.*' \
            -delete
        done) &
        exec /docker-entrypoint.sh

volumes:
  data:
  bot-api:
