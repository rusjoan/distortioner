services:
  distortioner:
    image: distortioner:dev # local build; deploy/compose.yaml uses the published image
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DISTORTIONER_TEMP_DIR: /tmp/distortioner
      DISTORTIONER_BOT_API_DIR: /var/lib/telegram-bot-api
    volumes:
      - data:/app/data
      # Files downloaded by the local Bot API server (profile local-api) are
      # read straight from its volume, at the same path the server reports.
      # The bot also deletes them after DISTORTIONER_BOT_API_FILES_TTL (3h).
      - bot-api:/var/lib/telegram-bot-api
    # Video frames are written and read many times: keep them in memory.
    tmpfs:
      - /tmp/distortioner:size=2g,mode=1777
    ports:
      - "127.0.0.1:8080:8080" # metrics and health checks; expose only if needed
    stop_grace_period: 45s # a bit longer than DISTORTIONER_SHUTDOWN_GRACE
    depends_on:
      telegram-bot-api:
        condition: service_started
        required: false

  # Self-hosted Bot API server: files up to 2 GB instead of 20 MB.
  # Enable with: docker compose --profile local-api up -d
  # and set DISTORTIONER_API_URL=http://telegram-bot-api:8081 in .env.
  telegram-bot-api:
    profiles: [local-api]
    image: aiogram/telegram-bot-api:10.3
    restart: unless-stopped
    env_file: .env # TELEGRAM_API_ID, TELEGRAM_API_HASH
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api:/var/lib/telegram-bot-api
    # The server keeps files private to its user (mode 750/600), so it runs
    # with the bot's uid (10001): the bot reads and deletes them.
    entrypoint:
      - sh
      - -c
      - |
        sed -i 's/^telegram-bot-api:x:[0-9]*:[0-9]*:/telegram-bot-api:x:10001:10001:/' /etc/passwd
        sed -i 's/^telegram-bot-api:x:[0-9]*:/telegram-bot-api:x:10001:/' /etc/group
        mkdir -p /tmp/telegram-bot-api
        chown -R telegram-bot-api:telegram-bot-api /var/lib/telegram-bot-api /tmp/telegram-bot-api
        exec /docker-entrypoint.sh

  # Prometheus, Grafana and node-exporter with a ready dashboard.
  # Enable with: docker compose --profile monitoring up -d
  # Grafana: http://127.0.0.1:3000 (GRAFANA_PORT; admin / GRAFANA_ADMIN_PASSWORD from .env)
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.1.8
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/distortioner.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]

  # Host CPU, memory, disks and network.
  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro

volumes:
  data:
  bot-api:
  prometheus:
  grafana:
