name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race
        run: make cover
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vuln

  docker:
    name: Docker image and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: itest
          load: true
          tags: distortioner-itest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Integration tests (real ffmpeg and ImageMagick)
        run: docker run --rm distortioner-itest go test -tags integration -count=1 ./...
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: distortioner
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run --rm distortioner version
          # Without a token the bot must refuse to start with a clear error.
          if docker run --rm distortioner 2> err.log; then exit 1; fi
          grep -q BOT_TOKEN err.log
